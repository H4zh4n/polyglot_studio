name: polyglot
description: Cross-platform Media Polyglot Generator with GetX state management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  polyglot_core:
    path: packages/polyglot_core
  get: ^4.7.3
  file_picker: ^11.0.3
  desktop_drop: ^0.7.1
  cross_file: ^0.3.5+4
  path: ^1.9.1
  video_player: ^2.14.0
  video_player_win: ^3.2.2
  device_preview: ^1.3.1
  device_preview_screenshot: ^1.0.0
  path_provider: ^2.1.6
  toastification: ^3.2.0
  flutter_widget_from_html: ^0.17.2
  pdfx: ^2.9.2
  archive: ^4.0.9
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dependency_overrides:
  path_provider_android: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo_small.png"
  windows:
    generate: true
    image_path: "assets/logo/logo_small.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/logo_small.png"
  linux:
    generate: true
    image_path: "assets/logo/logo_small.png"
  web:
    generate: true
    image_path: "assets/logo/logo_small.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
