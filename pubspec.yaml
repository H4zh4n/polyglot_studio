name: polyglot
description: Cross-platform Media Polyglot Generator with GetX state management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  polyglot_core:
    path: packages/polyglot_core
  get: ^4.6.6
  file_picker: ^8.1.7
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4
  path: ^1.9.0
  video_player: ^2.14.0
  video_player_win: ^3.2.2
  device_preview: ^1.3.1
  device_preview_screenshot: ^1.0.0
  path_provider: ^2.1.6

dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.8.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo_small.png"
  windows:
    generate: true
    image_path: "assets/logo/logo_small.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/logo_small.png"
  linux:
    generate: true
    image_path: "assets/logo/logo_small.png"
  web:
    generate: true
    image_path: "assets/logo/logo_small.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
